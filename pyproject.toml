[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshpreflight"
version = "0.1.0"
description = "Check a finite element mesh before you trust a simulation: geometry, tags, element quality and units, validated against exact answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mesh", "finite element", "FEM", "gmsh", "validation", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The core only needs arrays and sparse matrices, so it installs anywhere.
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
viz = ["plotly>=5.20"]
web = ["flask>=3.0", "plotly>=5.20"]
dev = ["pytest>=8.0", "flask>=3.0", "plotly>=5.20", "gmsh>=4.11"]

[project.scripts]
meshpreflight = "meshpreflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meshpreflight.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
